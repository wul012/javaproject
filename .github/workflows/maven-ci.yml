name: Java Maven CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and headless regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: advanced-order-platform

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Spotless ratchet check
        env:
          SPOTLESS_RATCHET_FROM: ${{ github.event_name == 'pull_request' && 'origin/master' || github.event.before }}
        run: >
          ./mvnw -B
          "-Dspotless.ratchetFrom=${SPOTLESS_RATCHET_FROM}"
          spotless:check

      - name: Wrapper verify without Docker tests
        run: >
          ./mvnw -B
          "-Dtest.jvm.argLine=-XX:TieredStopAtLevel=1 -Xmx512m"
          verify

      - name: Prod profile boot smoke
        run: |
          set -euo pipefail
          java -jar target/advanced-order-platform-0.1.0-SNAPSHOT.jar \
            --spring.profiles.active=prod \
            --server.port=18080 \
            --order.expiration.enabled=false \
            --outbox.publisher.enabled=false \
            > prod-smoke.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl --noproxy '*' -fsS http://localhost:18080/actuator/health | tee prod-health.json; then
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              tail -n 200 prod-smoke.log
              exit 1
            fi
            sleep 2
          done

          tail -n 200 prod-smoke.log
          exit 1

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: advanced-order-platform/target/site/jacoco/**
          if-no-files-found: ignore

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-test-diagnostics
          path: |
            advanced-order-platform/target/surefire-reports/**
            advanced-order-platform/target/site/jacoco/**
            advanced-order-platform/target/spotbugsXml.xml
            advanced-order-platform/prod-smoke.log
            advanced-order-platform/prod-health.json

  docker-tests:
    name: Docker-tagged integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: advanced-order-platform

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Wrapper verify Docker tests
        run: >
          ./mvnw -B
          -P docker-tests
          "-Dtest.jvm.argLine=-XX:TieredStopAtLevel=1 -Xmx512m"
          verify

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-tests-diagnostics
          path: |
            advanced-order-platform/target/surefire-reports/**
            advanced-order-platform/target/site/jacoco/**
            advanced-order-platform/target/spotbugsXml.xml
