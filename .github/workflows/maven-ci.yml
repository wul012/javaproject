name: Java Maven CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and headless regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: advanced-order-platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Wrapper verify without Docker tests
        run: >
          ./mvnw -B -q
          "-DargLine=-XX:TieredStopAtLevel=1 -Xmx512m"
          verify

  docker-tests:
    name: Docker-tagged integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: advanced-order-platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Wrapper verify Docker tests
        run: >
          ./mvnw -B -q
          -P docker-tests
          "-DargLine=-XX:TieredStopAtLevel=1 -Xmx512m"
          verify
