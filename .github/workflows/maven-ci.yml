name: Java Maven CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and headless regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: advanced-order-platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Spotless ratchet check
        env:
          SPOTLESS_RATCHET_FROM: ${{ github.event_name == 'pull_request' && 'origin/master' || github.event.before }}
        run: >
          ./mvnw -B
          "-Dspotless.ratchetFrom=${SPOTLESS_RATCHET_FROM}"
          spotless:check

      - name: Wrapper verify without Docker tests
        run: >
          ./mvnw -B
          "-DargLine=-XX:TieredStopAtLevel=1 -Xmx512m"
          verify

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-diagnostics
          path: |
            advanced-order-platform/target/surefire-reports/**
            advanced-order-platform/target/spotbugsXml.xml

  docker-tests:
    name: Docker-tagged integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: advanced-order-platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Wrapper verify Docker tests
        run: >
          ./mvnw -B
          -P docker-tests
          "-DargLine=-XX:TieredStopAtLevel=1 -Xmx512m"
          verify

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-tests-diagnostics
          path: |
            advanced-order-platform/target/surefire-reports/**
            advanced-order-platform/target/spotbugsXml.xml
